name: Bug report
description: Report an installation, upgrade or removal problem.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        Which installation, upgrade or removal step failed, and how does it affect your task?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: |
        What should happen instead? You do not need to propose a fix.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Include the formula, commands, output or error, program and Homebrew versions, operating system and architecture where available. Describe your observations even if you cannot reproduce the problem yet, and say which details are unknown.
    validations:
      required: true
