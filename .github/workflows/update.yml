name: Update

# Deliver the published Fastmash files without another build or package release.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      recipe_ref:
        description: Fastmash ref supplying the installation recipe, defaults to main
        required: false
      check_only:
        description: Check the update without changing the published recipe
        type: boolean
        default: false

permissions: {}

concurrency:
  group: update-fastmash
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.release.outputs.changed }}
      version: ${{ steps.release.outputs.version }}
      base: ${{ steps.release.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Prepare download references for the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RECIPE_REF: ${{ inputs.recipe_ref || 'main' }}
        run: |
          set -euo pipefail
          gh api repos/pederbe/fastmash/releases/latest > "$RUNNER_TEMP/release.json"
          tag=$(jq -er .tag_name "$RUNNER_TEMP/release.json")
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=${tag#v}
          current=$(sed -nE 's@.*github.com/pederbe/fastmash/(archive/refs/tags|releases/download)/v([0-9]+\.[0-9]+\.[0-9]+)(/|\.tar\.gz).*@\2@p' Formula/fastmash.rb | sort -u)
          [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(printf '%s\n' "$current" "$version" | sort -V | tail -1)" = "$version"
          mkdir "$RUNNER_TEMP/candidate"
          formula=$RUNNER_TEMP/candidate/fastmash.rb
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/pederbe/fastmash/contents/packaging/homebrew/fastmash.rb?ref=$RECIPE_REF" > "$formula"
          template_version=$(sed -nE 's@.*releases/download/v([0-9]+\.[0-9]+\.[0-9]+)/.*@\1@p' "$formula" | sort -u)
          [[ "$template_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # The one-time 0.4.0 revision migrates existing Homebrew builds.
          # A different application version starts again at revision zero.
          if [[ "$version" != "$template_version" ]]; then sed -i '/^  revision [0-9]/d' "$formula"; fi
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            name=fastmash-$tag-$target.tar.gz
            digest=$(jq -er --arg name "$name" '.assets[] | select(.name == $name) | .digest | select(test("^sha256:[0-9a-f]{64}$")) | ltrimstr("sha256:")' "$RUNNER_TEMP/release.json")
            url=https://github.com/pederbe/fastmash/releases/download/$tag/$name
            sed -i -e "/url .*-$target.tar.gz/s@url \"[^\"]*\"@url \"$url\"@" \
              -e "/url .*-$target.tar.gz/{n;s@sha256 \"[0-9a-f]*\"@sha256 \"$digest\"@;}" "$formula"
            grep -qF "url \"$url\"" "$formula"
            grep -qF "sha256 \"$digest\"" "$formula"
          done
          if cmp -s Formula/fastmash.rb "$formula"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'changed=true'
            echo "version=$version"
            echo "base=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.release.outputs.changed == 'true'
        with:
          name: fastmash-recipe
          path: ${{ runner.temp }}/candidate/fastmash.rb
          retention-days: 7
          if-no-files-found: error

  check:
    needs: candidate
    if: needs.candidate.outputs.changed == 'true'
    uses: ./.github/workflows/formula.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      formula-artifact: fastmash-recipe
      previous-ref: ${{ needs.candidate.outputs.base }}

  update:
    needs: [candidate, check]
    if: needs.candidate.outputs.changed == 'true' && inputs.check_only != true
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fastmash-recipe
          path: ${{ runner.temp }}/candidate
      - name: Commit the tested installation recipe
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.candidate.outputs.version }}
          BASE: ${{ needs.candidate.outputs.base }}
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          candidate=$RUNNER_TEMP/candidate/fastmash.rb
          if cmp -s Formula/fastmash.rb "$candidate"; then exit 0; fi
          git fetch origin "$BASE"
          git show "$BASE:Formula/fastmash.rb" > "$RUNNER_TEMP/previous.rb"
          cmp Formula/fastmash.rb "$RUNNER_TEMP/previous.rb"
          cp "$candidate" Formula/fastmash.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/fastmash.rb
          git commit -m "Update Fastmash installation to $VERSION"
          # Record completed recipe checks on the final commit so the required
          # CI gate can admit it. The temporary branch makes the commit available.
          checked_branch=checked-fastmash-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          git push origin "HEAD:refs/heads/$checked_branch"
          trap 'git push origin --delete "$checked_branch" || true' EXIT
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" \
            -f state=success -f context=CI -f description='Recipe installation checks passed' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push origin HEAD:main
