name: Formula

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The Update workflow passes a formula for a new release, as an artifact.
  workflow_call:
    inputs:
      formula-artifact:
        description: Artifact containing the fastmash.rb to build
        type: string
        required: true

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  formula:
    name: Build and test bottles on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      # Taps this checkout as pederbe/tap.
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Environment
        run: |
          brew --version
          sw_vers 2>/dev/null || cat /etc/os-release
          uname -m
      - run: brew test-bot --only-cleanup-before
      - name: Use the formula for the new release
        if: inputs.formula-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.formula-artifact }}
          path: Formula
      # Commit it as a pull request would, so test-bot audits the change.
      - name: Commit the formula for the new release
        if: inputs.formula-artifact
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'fastmash: update for testing' Formula/fastmash.rb
      - run: brew test-bot --only-setup
      - run: brew test-bot --only-tap-syntax
      - name: Build, bottle and test changed formulae
        if: github.event_name == 'pull_request' || inputs.formula-artifact
        run: brew test-bot --only-formulae ${{ inputs.formula-artifact && '--testing-formulae=pederbe/tap/fastmash' || '' }}
      - name: Retain bottles and checksums
        if: success() && (github.event_name == 'pull_request' || inputs.formula-artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
          retention-days: 14
      - name: Remove installations
        if: always()
        run: |
          prefix=$(brew --prefix)
          cellar=$(brew --cellar fastmash)
          if [[ -d "$cellar" ]]; then
            brew uninstall --force pederbe/tap/fastmash
          fi
          test ! -e "$prefix/bin/fastmash"
          test ! -e "$prefix/bin/fastmash-sort-supervisor"
          test ! -e "$cellar"
