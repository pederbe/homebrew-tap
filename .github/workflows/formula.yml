name: Formula

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      formula-artifact:
        description: Artifact containing the updated fastmash.rb
        type: string
        required: true
      previous-ref:
        description: Commit containing the recipe used before this update
        type: string
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  ci:
    name: CI
    needs: [formula]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Require passing installation checks
        env:
          RESULT: ${{ needs.formula.result }}
        run: test "$RESULT" = success

  formula:
    name: Check installation on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Retain the previous recipe for the upgrade check
        env:
          BASE: ${{ inputs.previous-ref || github.event.pull_request.base.sha || github.sha }}
        run: git show "$BASE:Formula/fastmash.rb" > "$RUNNER_TEMP/previous-fastmash.rb"
      - name: Use the candidate installation recipe
        if: inputs.formula-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.formula-artifact }}
          path: Formula
      - name: Check recipes and the changed installation
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          brew style pederbe/tap
          brew readall --aliases --os=all --arch=all pederbe/tap
          brew audit --except=installed pederbe/tap
          packages=fastmash
          if [[ -n "$BASE" ]]; then
            packages=$(git diff --name-only "$BASE" HEAD -- 'Formula/*.rb' | sed -n 's@^Formula/\(.*\)\.rb$@\1@p')
            packages=${packages:-fastmash}
          fi
          gh api -H 'Accept: application/vnd.github.raw' \
            repos/pederbe/fastmash/contents/packaging/homebrew/check-install.sh > "$RUNNER_TEMP/check-install.sh"
          for package in $packages; do
            previous=
            if [[ "$package" == fastmash ]]; then previous=$RUNNER_TEMP/previous-fastmash.rb; fi
            bash "$RUNNER_TEMP/check-install.sh" "pederbe/tap/$package" "$previous"
          done
      - name: Remove installations
        if: always()
        run: |
          prefix=$(brew --prefix)
          for package in fastmash esdieff; do
            cellar=$(brew --cellar "$package")
            if [[ -d "$cellar" ]]; then brew uninstall --force "$package"; fi
            test ! -e "$prefix/bin/$package"
            test ! -e "$cellar"
          done
          test ! -e "$prefix/bin/fastmash-sort-supervisor"
