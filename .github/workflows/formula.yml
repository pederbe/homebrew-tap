name: Formula

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  formula:
    name: Build and test bottles on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      # Taps this checkout as pederbe/tap.
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Environment
        run: |
          brew --version
          sw_vers 2>/dev/null || cat /etc/os-release
          uname -m
      - run: brew test-bot --only-cleanup-before
      - run: brew test-bot --only-setup
      - run: brew test-bot --only-tap-syntax
      - name: Build, bottle and test changed formulae
        if: github.event_name == 'pull_request'
        run: brew test-bot --only-formulae
      - name: Retain bottles and checksums
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
          retention-days: 14
      - name: Remove installations
        if: always()
        run: |
          prefix=$(brew --prefix)
          cellar=$(brew --cellar fastmash)
          if [[ -d "$cellar" ]]; then
            brew uninstall --force pederbe/tap/fastmash
          fi
          test ! -e "$prefix/bin/fastmash"
          test ! -e "$prefix/bin/fastmash-sort-supervisor"
          test ! -e "$cellar"
